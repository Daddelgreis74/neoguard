services:
  tapo-room-guard:
    build: .
    image: daddelgreis74/tapo-room-guard:latest
    container_name: tapo-room-guard
    restart: unless-stopped
    ports:
      - "8095:8095"
    environment:
      - TZ=Europe/Berlin
      - PORT=8095
      - TAPO_HOST=${TAPO_HOST:-192.168.178.50}
      - TAPO_RTSP_USER=${TAPO_RTSP_USER:-}
      - TAPO_RTSP_PASS=${TAPO_RTSP_PASS:-}
      - TAPO_CLOUD_PASS=${TAPO_CLOUD_PASS:-}
    volumes:
      - ./data:/app/data
