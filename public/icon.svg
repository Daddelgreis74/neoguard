<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- 3D Outer Rim Gradient (Top-Left Lit -> Bottom-Right Shadow) -->
    <linearGradient id="shieldRim3D" x1="10" y1="4" x2="54" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="42%" stop-color="#38bdf8"/>
      <stop offset="72%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- 3D Bevel Depth Base -->
    <linearGradient id="shieldDepth" x1="32" y1="6" x2="32" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Left & Right 3D Facets -->
    <linearGradient id="facetLeft" x1="12" y1="12" x2="32" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1b2b4b"/>
      <stop offset="100%" stop-color="#0d172e"/>
    </linearGradient>
    <linearGradient id="facetRight" x1="32" y1="12" x2="52" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#111d38"/>
      <stop offset="100%" stop-color="#070d1d"/>
    </linearGradient>

    <!-- Lens Housing 3D Bezel -->
    <linearGradient id="lensBezel" x1="20" y1="18" x2="44" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="45%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Deep Lens Cavity -->
    <radialGradient id="lensCavity" cx="50%" cy="55%" r="50%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="75%" stop-color="#030712"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <!-- 3D Glass Iris Dome -->
    <radialGradient id="irisDome" cx="50%" cy="50%" r="50%" fx="38%" fy="35%">
      <stop offset="0%" stop-color="#a5f3fc"/>
      <stop offset="32%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>

    <!-- 3D Status LED -->
    <radialGradient id="led3D" cx="50%" cy="50%" r="50%" fx="35%" fy="35%">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="55%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#065f46"/>
    </radialGradient>

    <!-- Drop Shadow -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.2" flood-color="#020617" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- 3D Extruded Back Plate -->
  <path d="M32 7.5L54 16.2V32.5C54 46.2 44.6 56.4 32 61.2C19.4 56.4 10 46.2 10 32.5V16.2L32 7.5Z"
        fill="url(#shieldDepth)" opacity="0.9"/>

  <!-- Main 3D Shield Body -->
  <g filter="url(#softShadow)">
    <path d="M32 5L53 13.5V30.2C53 43.6 44.1 53.5 32 58.3C19.9 53.5 11 43.6 11 30.2V13.5L32 5Z"
          fill="#0b1326" stroke="url(#shieldRim3D)" stroke-width="2.8" stroke-linejoin="round"/>

    <!-- Left Lit Facet -->
    <path d="M32 9.2L15.2 16V30.1C15.2 40.9 22.3 49.1 32 53.6V9.2Z" fill="url(#facetLeft)"/>
    <!-- Right Shaded Facet -->
    <path d="M32 9.2L48.8 16V30.1C48.8 40.9 41.7 49.1 32 53.6V9.2Z" fill="url(#facetRight)"/>

    <!-- Inner Bevel Highlight (Top-Left) -->
    <path d="M15.4 29V16.1L32 9.4L48.4 16" stroke="rgba(186,230,253,0.35)" stroke-width="1" stroke-linecap="round"/>
    <!-- Center Ridge Line -->
    <line x1="32" y1="9.5" x2="32" y2="53.4" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  </g>

  <!-- 3D Recessed Camera Barrel -->
  <circle cx="32" cy="31" r="12.5" fill="#020617" opacity="0.65"/>
  <circle cx="32" cy="30.2" r="11.5" fill="url(#lensCavity)" stroke="url(#lensBezel)" stroke-width="2.4"/>
  <circle cx="32" cy="30.2" r="9" stroke="rgba(56,189,248,0.22)" stroke-width="1"/>

  <!-- 3D Glass Iris Dome -->
  <circle cx="32" cy="30.2" r="6.4" fill="url(#irisDome)"/>
  <!-- Specular Glass Highlights -->
  <path d="M27.6 27.6C28.8 25.8 31 25 33.2 25.4" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" opacity="0.88"/>
  <circle cx="30" cy="28" r="1.4" fill="#ffffff" opacity="0.9"/>
  <circle cx="34.5" cy="32.8" r="0.8" fill="#34d399" opacity="0.85"/>

  <!-- 3D Status LED -->
  <circle cx="32" cy="14.6" r="2.2" fill="url(#led3D)" stroke="rgba(255,255,255,0.25)" stroke-width="0.6"/>
</svg>
